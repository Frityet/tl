name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: main

jobs:
  Test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@master

    - uses: luarocks/gh-actions-lua@master
      with:
        luaVersion: "luajit-2.1"

    - uses: luarocks/gh-actions-luarocks@master

    - name: Cache LuaRocks packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && 'C:\\Users\\runneradmin\\AppData\\Roaming\\luarocks' || format('{0}/.luarocks', github.workspace) }}
        key: ${{ runner.os }}-luarocks-luajit-${{ hashFiles('**/luarocks.lock') }}

    - name: Build
      run: |
        luarocks make --only-deps

    - name: Test
      run: |
        luarocks lint tl-dev-2.rockspec
        make selfbuild
        luarocks test
